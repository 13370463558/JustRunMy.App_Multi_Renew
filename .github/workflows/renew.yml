name: JustRunMy 自动续期 (单账号精简版)

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 06:00 (UTC 22:00) 触发，触发后随机延迟 2~6 小时执行
    - cron: '0 22 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: 📥 下载代码
      uses: actions/checkout@v4

    - name: 🐍 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: ⏳ 随机延迟 (2~6 小时，模拟真实使用)
      env:
        RD: ${{ secrets.RD }}
      run: |
        if [ -n "$RD" ]; then
          MIN=$(echo "$RD" | cut -d: -f1)
          MAX=$(echo "$RD" | cut -d: -f2)
        else
          MIN=7200; MAX=21600
        fi
        DELAY=$(shuf -i $MIN-$MAX -n 1)
        H=$(( DELAY / 3600 )); M=$(( (DELAY % 3600) / 60 ))
        echo "✅ 随机延迟: ${H}h${M}m，之后执行续期"
        sleep $DELAY

    - name: 🛡️ 启动 sing-box 代理
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
      run: |
        if [ -z "$PROXY_URL" ]; then
          echo "⚠️ 未设置 PROXY_URL，将尝试直连。"
          exit 0
        fi

        SINGBOX_VER="1.13.14"
        echo "正在安装 sing-box v$SINGBOX_VER..."
        wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
        tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
        mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
        chmod +x ./sing-box

        # 生成配置文件 (调用项目中的解析脚本，兼容 pcs/hex/allowInsecure)
        python proxy_handler.py

        # 后台运行
        nohup ./sing-box run -c config.json > singbox.log 2>&1 &
        sleep 5

        echo "🔍 验证代理出口..."
        export http_proxy=http://127.0.0.1:8080
        export https_proxy=http://127.0.0.1:8080
        curl -s --connect-timeout 10 https://api.ipify.org || echo "无法获取出口 IP"

    - name: 🛠️ 安装自动化依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: 🚀 运行账号续期
      env:
        EML: ${{ secrets.EML }}
        PWD: ${{ secrets.PWD }}
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_ID: ${{ secrets.TG_ID }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
      run: |
        echo "开始处理账号续期..."
        # 启动虚拟显示器并执行脚本
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python reset_timer.py

    - name: 📸 错误截图上传
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug
        path: "*.png"
        retention-days: 3